
name: Snake Game YouTube Live

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  youtube-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      SNAKE_PAGE_URL: https://soulfulmat1.github.io/snake-game-live/

    steps:
      - name: Install streaming tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            pulseaudio \
            dbus-x11

          ffmpeg -version

          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Installing Google Chrome..."

            wget -q \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              -O /tmp/google-chrome.deb

            sudo apt-get install -y \
              /tmp/google-chrome.deb
          fi

          google-chrome --version

      - name: Start virtual display and audio
        run: |
          Xvfb :99 \
            -screen 0 1080x1920x24 \
            -ac +extension GLX +render -noreset \
            > /tmp/xvfb.log 2>&1 &

          sleep 3

          pulseaudio --start \
            --exit-idle-time=-1 || true

          sleep 2

          pactl load-module module-null-sink \
            sink_name=GameAudio \
            sink_properties=device.description=GameAudio

          pactl set-default-sink GameAudio

          echo "Virtual display and audio ready."

      - name: Start Snake Game
        env:
          DISPLAY: :99
          PULSE_SINK: GameAudio
        run: |
          echo "Opening: $SNAKE_PAGE_URL"

          unset DBUS_SESSION_BUS_ADDRESS

          nohup dbus-run-session -- \
            google-chrome \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-background-networking \
            --autoplay-policy=no-user-gesture-required \
            --kiosk \
            --window-position=0,0 \
            --window-size=1080,1920 \
            "$SNAKE_PAGE_URL" \
            > /tmp/chrome.log 2>&1 \
            < /dev/null &

          sleep 15

          if pgrep -f "/opt/google/chrome/chrome" >/dev/null; then
            echo "SUCCESS: Chrome is running."
          else
            echo "ERROR: Chrome did not start."
            tail -n 80 /tmp/chrome.log
            exit 1
          fi

      - name: Start Snake Game YouTube stream
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YouTube Stream Key missing."
            exit 1
          fi

          # Total streaming window:
          # 5 hours 35 minutes
          DURATION=20100
          END_TIME=$(($(date +%s) + DURATION))

          # Request next workflow before current job ends.
          (
            sleep 19800

            echo "Requesting next workflow..."

            curl --fail-with-body \
              --retry 3 \
              --request POST \
              --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live.yml/dispatches" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data '{"ref":"main"}'

            echo "Next workflow requested."
          ) &

          echo "Starting YouTube Live..."

          while true; do

            REMAINING=$((END_TIME - $(date +%s)))

            if [ "$REMAINING" -le 0 ]; then
              echo "Streaming duration completed."
              break
            fi

            echo "Remaining: $REMAINING seconds"

            timeout \
              --signal=INT \
              --kill-after=15s \
              "${REMAINING}s" \
              ffmpeg \
              -hide_banner \
              -loglevel warning \
              -thread_queue_size 1024 \
              -f x11grab \
              -framerate 30 \
              -video_size 1080x1920 \
              -i :99.0 \
              -thread_queue_size 1024 \
              -f pulse \
              -i GameAudio.monitor \
              -c:v libx264 \
              -preset veryfast \
              -tune zerolatency \
              -pix_fmt yuv420p \
              -r 30 \
              -b:v 6800k \
              -maxrate 6800k \
              -bufsize 13600k \
              -g 60 \
              -c:a aac \
              -b:a 128k \
              -ar 44100 \
              -ac 2 \
              -f flv \
              "rtmp://a.rtmp.youtube.com/live2/$YOUTUBE_STREAM_KEY" \
              || true

            REMAINING=$((END_TIME - $(date +%s)))

            if [ "$REMAINING" -le 0 ]; then
              break
            fi

            echo "FFmpeg disconnected."
            echo "Reconnecting in 10 seconds..."

            sleep 10

          done

          echo "YouTube Live session finished."
